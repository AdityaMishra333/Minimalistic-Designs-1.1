<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Machine</title>
    <style>
        html{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        body{
            background-color: black;
            font-family: sans-serif;
            color: aliceblue;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border: solid 0.2rem;
            width: 50%;
            height: 50%;
            border-radius: 2rem;
            animation: glow 2s linear infinite;
        }
        .light-theme{
            background-color: aliceblue;
            font-family: sans-serif;
            color: black;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border: solid 0.2rem;
            width: 50%;
            height: 50%;
            border-radius: 2rem;
            animation: glow 2s linear infinite;
        }
        @keyframes glow {
          0%   { box-shadow: 0 0 2rem orangered; }
          50%  { box-shadow: 0 0 2rem yellow; }
          100% { box-shadow: 0 0 2rem orangered; }
        }
        #display{
            display: flex;
            justify-content: center;
            align-items: center;
            border: solid 0.1rem;
            width: 40%;
            height: 50%;
            border-radius: 2rem;
            font-size: 200%;
        }
        #display:hover{
            scale: 0.98;
            cursor: pointer;
        }
        #buttons{
            display: grid;
            justify-content: space-evenly;
            align-items: center;
            border: solid 0.1rem;
            width: 40%;
            height: 85%;
            border-radius: 2rem;
        }
        #increase{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border: solid 0.1rem;
            width: auto;
            height: auto;
            padding: .5rem;
            border-radius: 1rem;
            font-size: larger;
        }
        #increase:hover{
            color: black;
            background-color: aliceblue;
            cursor: pointer;
        }
        #decerease{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border: solid 0.1rem;
            width: auto;
            height: auto;
            padding: .5rem;
            border-radius: 1rem;
            font-size: larger;
        }
        #decerease:hover{
            color: black;
            background-color: aliceblue;
            cursor: pointer;
        }
        #reset{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border: solid 0.1rem;
            width: auto;
            height: auto;
            padding: .5rem;
            border-radius: 1rem;
            font-size: larger;
        }
        #reset:hover{
            color: black;
            background-color: aliceblue;
            cursor: pointer;
        }
        #toggle{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border: solid 0.1rem;
            width: auto;
            height: auto;
            padding: .5rem;
            border-radius: 1rem;
            font-size: larger;
        }
        #toggle:hover{
            color: black;
            background-color: aliceblue;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="display">
        0
    </div>

    <div id="buttons">
        <div id="toggle">Change Theme</div>
        <div id="increase">Increase</div>
        <div id="reset">Reset</div>
        <div id="decerease">Decerease</div>
    </div>
</body>

<script>
    let count = 0;
    const display = document.getElementById("display");

    const increase = document.getElementById("increase");
    const reset = document.getElementById("reset");
    const decerease = document.getElementById("decerease");

    //color adaptation according to count
    function updatecolor(){
        if(count > 0){
            display.style.color = "lime";
        }
        if(count < 0){
            display.style.color = "red";
        }
        if(count == 0){
            display.style.color = "yellow";
        }
    }

    //working buttons on page
    increase.addEventListener("click", function(){
        count++;
        display.textContent = count;
        updatecolor();
        localStorage.setItem("count", count);
    })

    decerease.addEventListener("click", function(){
        count--;
        display.textContent = count;
        updatecolor();
        localStorage.setItem("count", count);
    })

    reset.addEventListener("click", function(){
        count = 0;
        display.textContent = count;
        updatecolor();
        localStorage.setItem("count", count);
    })

    //to control using keyboard
    document.addEventListener("keydown", function(clicked){
        if(clicked.key == "ArrowUp"){
            count++;
        }
        if(clicked.key == "ArrowDown"){
            count--;
        }
        if(clicked.key == " "){
            count = 0;
        }

        display.textContent = count;
        updatecolor();
        localStorage.setItem("count", count);
    });

    //to toggle between dark and light theme
    const body = document.body;
    const toggle = document.getElementById("toggle");
    const savedtheme = localStorage.getItem("theme");
    if(savedtheme == "light"){
        body.classList.add("light-theme");
    }
    toggle.addEventListener("click", function(){
        body.classList.toggle("light-theme");
        if(body.classList.contains("light-theme")){
            localStorage.setItem("theme", "light");
        }
        else{
            localStorage.setItem("theme", "dark");
        }
    })

    let savedCount = localStorage.getItem("count"); //stores last count details
    if (savedCount !== null) {
      count = parseInt(savedCount);
      display.textContent = count;
      updatecolor();
    }

</script>
</html>
